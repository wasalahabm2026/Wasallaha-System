<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حساباتي | Wasalha BM Finance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F7FB;--navy:#172554;--blue:#2563EB;--green:#16A34A;--amber:#F59E0B;--red:#DC2626;--ink:#1F2937;--mut:#6B7280;--line:#E5E7EB;--card:#fff;--r:12px;--sh:0 1px 2px rgba(23,37,84,.06),0 6px 18px rgba(23,37,84,.05)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo','Tajawal',Tahoma,'Segoe UI',system-ui,sans-serif;font-size:15px;line-height:1.6}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue);text-decoration:none}
h1,h2,h3{margin:0;line-height:1.35}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
.app{display:flex;min-height:100vh}
.side{width:256px;background:var(--navy);color:#fff;position:fixed;inset:0 0 0 auto;z-index:50;display:flex;flex-direction:column;padding:18px 12px;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:12px}
.brand svg{width:38px;height:38px;flex:none}
.brand b{display:block;font-size:19px;font-weight:800}
.brand small{display:block;font-size:11.5px;opacity:.7;direction:ltr;text-align:right}
.nav a{display:flex;align-items:center;gap:10px;color:rgba(255,255,255,.82);padding:10px 12px;border-radius:10px;margin:2px 0;font-weight:600;border-inline-start:3px solid transparent}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.on{background:rgba(255,255,255,.12);color:#fff;border-inline-start-color:var(--amber)}
.side .foot{margin-top:auto;font-size:12px;opacity:.65;padding:12px 8px 0}
.main{flex:1;margin-right:256px;min-width:0;padding:24px 28px 80px}
.mtop{display:none}
.scrim{display:none}
#view{max-width:1240px;margin:0 auto}
.phead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.phead h1{font-size:23px;font-weight:800;color:var(--navy);display:flex;gap:10px;align-items:center}
.pact{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.card h2{font-size:16.5px;font-weight:700;color:var(--navy);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card+.card,.card+.grid,.grid+.card,.grid+.grid,.seg+.card{margin-top:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.gauto{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);min-width:0}
.stat .l{font-size:13px;color:var(--mut);font-weight:600}
.stat .v{font-size:27px;font-weight:800;color:var(--navy);line-height:1.25;margin-top:2px;overflow-wrap:anywhere}
.stat .v.sm{font-size:19px}
.stat .s{font-size:12.5px;color:var(--mut);margin-top:2px}
.stat.green .v{color:var(--green)}.stat.red .v{color:var(--red)}.stat.blue .v{color:var(--blue)}.stat.amber .v{color:#B45309}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 15px;border-radius:10px;cursor:pointer;font-weight:700;white-space:nowrap}
.btn:hover{border-color:#cbd5e1;background:#f8fafc}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.primary:hover{background:#1d4ed8}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.danger{background:#fff;color:var(--red);border-color:#fecaca}.btn.danger:hover{background:#fef2f2}
.btn.solid-danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.icon-btn{border:1px solid var(--line);background:#fff;border-radius:9px;width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.icon-btn:hover{background:#f1f5f9}.icon-btn.danger{color:var(--red)}
:focus-visible{outline:3px solid rgba(37,99,235,.45);outline-offset:1px}
label.lb{display:block;font-weight:700;font-size:13.5px;margin-bottom:5px;color:#374151}
input,select,textarea{width:100%;background:#fff;border:1px solid #D1D5DB;border-radius:10px;padding:9px 12px;min-height:40px}
input[type=checkbox],input[type=radio]{width:auto;min-height:0;accent-color:var(--blue)}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--blue);outline:2px solid rgba(37,99,235,.2)}
input[readonly]{background:#F3F4F6;color:var(--mut)}
.f{min-width:0}
.fg{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.fg .wide{grid-column:1/-1}
.inl{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.rowi{display:flex;gap:8px;align-items:stretch}
.rowi .combo{flex:1;min-width:0}
.mt{margin-top:8px}
.muted{color:var(--mut);font-size:13.5px}
.hint{font-size:12.5px;color:var(--mut);margin-top:4px}
.seg{display:inline-flex;background:#E8EDF7;border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap;margin-bottom:14px;max-width:100%}
.seg button{border:0;background:transparent;padding:7px 13px;border-radius:9px;font-weight:700;color:#475569;cursor:pointer}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.pbar .seg{margin:0}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;background:#E5E7EB;color:#374151}
.badge.green{background:#DCFCE7;color:#166534}.badge.blue{background:#DBEAFE;color:#1E40AF}.badge.red{background:#FEE2E2;color:#991B1B}.badge.amber{background:#FEF3C7;color:#92400E}.badge.gray{background:#EEF2F7;color:#475569}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:1px dashed #94A3B8;background:#fff;border-radius:99px;padding:2px 11px;font-size:13px;cursor:pointer;font-weight:600}
.chip:hover{background:#EFF6FF;border-color:var(--blue)}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{background:#F1F5F9;text-align:right;padding:9px 12px;font-weight:700;color:#334155;white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
tbody tr.clk{cursor:pointer}tbody tr.clk:hover{background:#F8FAFF}
tfoot td{font-weight:800;background:#F8FAFC}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--green);font-weight:700}.neg{color:var(--red);font-weight:700}
.ocs{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
.oc{background:#fff;border:1px solid var(--line);border-inline-start:5px solid var(--blue);border-radius:var(--r);padding:13px 15px;cursor:pointer;box-shadow:var(--sh);display:flex;flex-direction:column;gap:5px;min-width:0}
.oc:hover{border-color:#bfd0f5;border-inline-start-color:var(--blue)}
.oc.st-completed{border-inline-start-color:var(--green)}
.oc.st-cancelled{border-inline-start-color:var(--red);background:#FFFBFB}
.oc.st-cancelled .tot{text-decoration:line-through;color:var(--mut)}
.oc .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.oc .top b{font-size:17px;color:var(--navy);margin-inline-end:auto}
.oc .when{font-size:13.5px;color:var(--mut)}
.oc .route{font-weight:700;font-size:14.5px;overflow-wrap:anywhere}
.oc .route small{color:var(--mut);font-weight:600;margin:0 3px}
.oc .bot{display:flex;justify-content:space-between;gap:10px;align-items:flex-end;margin-top:3px;border-top:1px dashed var(--line);padding-top:7px}
.oc .tot{font-size:20px;font-weight:800;color:var(--navy);white-space:nowrap}
.oc .spl{font-size:13px;color:#475569;text-align:left;min-width:0;overflow-wrap:anywhere}
.oc .dl{font-size:13px;color:var(--blue);font-weight:700}
.empty{text-align:center;padding:34px 16px;color:var(--mut)}
.empty .ic{width:44px;height:44px;stroke-width:1.4;color:#94A3B8}
.empty h3{color:var(--navy);margin:8px 0 4px;font-size:17px}
.empty .btn{margin-top:12px}
.combo{position:relative}
.combo-list{position:absolute;inset-inline:0;top:calc(100% + 3px);background:#fff;border:1px solid #CBD5E1;border-radius:10px;box-shadow:0 10px 28px rgba(15,23,42,.18);max-height:240px;overflow:auto;z-index:40}
.combo-opt{padding:8px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.cust-opt{padding:8px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}.cust-opt small{color:var(--mut);direction:ltr}.cust-opt:hover{background:#EFF6FF}
.combo-opt small{color:var(--mut)}
.combo-opt.on,.combo-opt:hover{background:#EFF6FF}
.combo-empty{padding:10px 12px;color:var(--mut);font-size:13px}
.formsec{padding:0}
.formsec>h2{padding:14px 18px;border-bottom:1px solid var(--line);margin:0;background:#FAFBFE;border-radius:var(--r) var(--r) 0 0}
.formsec .body{padding:18px}
.srow{display:grid;grid-template-columns:minmax(150px,1.4fr) 38px minmax(100px,.8fr) minmax(120px,1fr) 38px;gap:8px;align-items:center;margin-bottom:8px}
.shead{display:grid;grid-template-columns:minmax(150px,1.4fr) 38px minmax(100px,.8fr) minmax(120px,1fr) 38px;gap:8px;font-size:12.5px;font-weight:700;color:var(--mut);margin-bottom:4px}
.totbox{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;background:#F1F5F9;border-radius:10px;padding:12px 14px;margin-top:10px}
.totbox .big{font-size:23px;font-weight:800;color:var(--navy)}
.formbar{position:sticky;bottom:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px -4px 0;border-radius:var(--r);box-shadow:0 -6px 18px rgba(23,37,84,.08);z-index:20}
.errbox{background:#FEF2F2;border:1px solid #FECACA;color:#991B1B;border-radius:10px;padding:10px 14px;margin-bottom:14px}
.errbox ul{margin:4px 18px 0;padding:0}
.note{background:#FFFBEB;border:1px solid #FDE68A;color:#78350F;border-radius:10px;padding:10px 14px;font-size:14px}
.note.info{background:#EFF6FF;border-color:#BFDBFE;color:#1E3A8A}
.note.bad{background:#FEF2F2;border-color:#FECACA;color:#7F1D1D}
.hb-row{display:grid;grid-template-columns:minmax(80px,32%) 1fr auto;gap:10px;align-items:center;margin:7px 0;font-size:14px}
.hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-t{height:12px;background:#EDF1F8;border-radius:99px;overflow:hidden}
.hb-t i{display:block;height:100%;border-radius:99px}
.vb{display:flex;gap:6px;align-items:flex-end;height:190px;overflow-x:auto;padding-bottom:2px}
.vb-c{flex:1 0 26px;max-width:60px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;font-size:11.5px;color:var(--mut)}
.vb-bar{width:100%;background:var(--blue);border-radius:6px 6px 0 0;min-height:2px}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:14px}
.modal{background:#fff;border-radius:16px;width:min(760px,100%);max-height:94vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.modal.wide{width:min(980px,100%)}
.mh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mh h3{font-size:18px;color:var(--navy)}
.mb{padding:18px;overflow-y:auto}
.mf{display:flex;gap:8px;flex-wrap:wrap;padding-top:14px;margin-top:14px;border-top:1px solid var(--line)}
.dlg{background:#fff;border-radius:16px;width:min(440px,100%);padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.dlg h3{font-size:18px;color:var(--navy);margin-bottom:8px}
.dlg p{margin:0 0 12px;color:#374151}
.dlg .acts{display:flex;gap:8px;justify-content:flex-start;margin-top:14px}
#dialogRoot .overlay{z-index:200}
#toasts{position:fixed;bottom:18px;inset-inline:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:300;pointer-events:none;padding:0 12px}
.toast{background:var(--navy);color:#fff;padding:10px 18px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-weight:600;max-width:min(520px,100%)}
.toast.ok{background:#15803D}.toast.err{background:var(--red)}.toast.warn{background:#B45309}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 18px}
.kv div span{display:block;font-size:12.5px;color:var(--mut);font-weight:600}
.kv div b{font-weight:700;overflow-wrap:anywhere}
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 14px;font-weight:700;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--navy);border-bottom-color:var(--blue)}
.vgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.vc{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;box-shadow:var(--sh)}
.vc:hover{border-color:#bfd0f5}
.vc.arch{opacity:.72;background:#F9FAFB}
.vc h3{font-size:16.5px;color:var(--navy);margin-bottom:4px}
.setrow{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.setrow:first-of-type{border-top:0}
.checks{display:flex;gap:14px;flex-wrap:wrap}
.checks label{display:flex;gap:6px;align-items:center;font-weight:600}
.sync{display:flex;align-items:center;gap:7px;font-size:12px;margin:10px 8px 0;padding:6px 10px;border-radius:99px;background:rgba(255,255,255,.1);color:#fff}
.sync i{width:9px;height:9px;border-radius:50%;background:#94A3B8;flex:none}
.sync.live i{background:#22C55E}.sync.connecting i,.sync.offline i{background:#F59E0B}.sync.error i{background:#EF4444}
#printArea{display:none}
.pa{font-family:'Cairo',Tahoma,sans-serif;color:#111;font-size:11.5pt}
.pa h1{font-size:18pt;margin:0 0 2px}.pa h2{font-size:13pt;margin:16px 0 6px;border-bottom:2px solid #172554;padding-bottom:2px}
.pa table{font-size:10pt}.pa th{background:#EEF1F7}.pa td,.pa th{border:1px solid #bbb;padding:4px 7px}
.pa .sg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.pa .sg div{border:1px solid #bbb;padding:5px 8px}.pa .sg span{font-size:9pt;color:#555;display:block}
@media print{
 @page{size:A4;margin:12mm}
 body>*:not(#printArea){display:none!important}
 #printArea{display:block!important}
 body{background:#fff}
}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
 .side{transform:translateX(100%);transition:transform .22s;width:270px}
 .side.open{transform:none}
 .scrim.open{display:block;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:45}
 .main{margin-right:0;padding:0 14px 90px}
 .mtop{display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--navy);color:#fff;margin:0 -14px 16px;padding:10px 14px;z-index:30}
 .mtop b{flex:1;font-size:17px}
 .mtop .icon-btn{background:rgba(255,255,255,.12);border-color:transparent;color:#fff}
}
@media (max-width:640px){
 .g2,.g3,.g4{grid-template-columns:1fr 1fr}
 .stat .v{font-size:21px}.stat .v.sm{font-size:16px}
 .phead h1{font-size:20px}
 .card{padding:14px}
 .srow{grid-template-columns:1fr 38px 38px;grid-template-areas:"a b e" "c c c" "d d d"}
 .srow>.combo{grid-area:a}.srow>.addb{grid-area:b}.srow>.amt{grid-area:c}.srow>.rn{grid-area:d}.srow>.delb{grid-area:e}
 .shead{display:none}
 .overlay{padding:0;align-items:flex-end}
 .modal,.modal.wide{width:100%;max-height:96vh;border-radius:18px 18px 0 0}
 .ocs{grid-template-columns:1fr}
 .formbar .btn{flex:1}
}
@media (max-width:420px){.g2,.g3,.g4{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<div class="app">
 <aside class="side" id="side" aria-label="القائمة الرئيسية">

 </main>
</div>

<script>
(()=>{'use strict';
/* =====================================================================
   0) ثوابت وأدوات عامة
   ===================================================================== */
/* DB_NAME: قاعدة IndexedDB هنا أصبحت «نسخة محلية مؤقتة» من بيانات Firestore (للعرض السريع).
   اسمها مختلف عن القاعدة المحلية القديمة (wasalha_bm_finance) حتى لا تُمسح أي بيانات محلية قديمة ولا تختلط بالسحابية. */
const DB_NAME='wasalha_bm_finance_cloud', DB_VERSION=2, SCHEMA_VERSION=1, APP_ID='wasalha-bm-finance';
const FB_CONFIG={
  apiKey: "AIzaSyDDNWrgBVrofUPHhBoE-Fhs-ILZzJ7sJhU",
  authDomain: "wasallaha-system.firebaseapp.com",
  projectId: "wasallaha-system",
  storageBucket: "wasallaha-system.firebasestorage.app",
  messagingSenderId: "384113877154",
  appId: "1:384113877154:web:5006416e49e756175df7fb",
  measurementId: "G-PH5PPCWMJ1"
};
const FB_SDK='https://www.gstatic.com/firebasejs/10.14.1/';
const CLOUD_STORES=['orders','venues','accounts','expenses','types','cats','customers','agreements','collections']; // مجموعات Firestore (الإعدادات في settings/main والعدادات في meta/counters)
const SET_LOCAL_KEYS=['key','recentAccounts','recentVenues','lastBackupAt']; // إعدادات خاصة بكل جهاز ولا تُرفع
const TYPE_LABEL={app:'التطبيق',courier:'مندوب',mgmt:'إدارة',partner:'شريك',other:'أخرى'};

  const F=this.fs,db=this.db,sp=new Map(),ops=[],keep=new Set();
  p.splits.forEach(s=>{if(!sp.has(s.orderId))sp.set(s.orderId,[]);sp.get(s.orderId).push(s)});
  const add=(col,id,data)=>{keep.add(col+'/'+id);ops.push({ref:F.doc(db,col,id),data:jclean(data)})};
  ['venues','accounts','expenses','types','cats','customers','agreements','collections'].forEach(n=>(p[n]||[]).forEach(x=>add(n,x.id,x)));
  p.orders.forEach(o=>add('orders',o.id,{...o,splits:(sp.get(o.id)||[]).sort((a,b)=>(a.idx||0)-(b.idx||0))}));

  add('meta','counters',{orderSeq:p.orderSeq,expenseSeq:p.expenseSeq});

const venueMatches=(o,key)=>vkey(o)===key||(Array.isArray(o.venueItems)&&o.venueItems.some(v=>(v.venueId||('txt:'+(v.venueText||'').trim()))===key));

function workday(at){ // 'YYYY-MM-DDTHH:mm' → يوم العمل أو null (خارج ساعات العمل)
 const date=at.slice(0,10),mins=hm(at.slice(11)),st=hm(S.set.workStart),en=hm(S.set.workEnd);
 if(en<=st){if(mins>=st)return date;if(mins<en)return addDays(date,-1);return null}
 return(mins>=st&&mins<en)?date:null;}
function effDay(o){ // اليوم المعتمد للأوردر وفق الإعدادات (null = مستبعد لأنه خارج الساعات)
 const date=o.orderAt.slice(0,10);if(S.set.dateBasis==='actual')return date;
 const w=workday(o.orderAt);return w!==null?w:(S.set.outsidePolicy==='actualDate'?date:null);}
const logDay=o=>{const d=o.orderAt.slice(0,10);if(S.set.dateBasis==='actual')return d;return workday(o.orderAt)??d};
const expDay=e=>{const d=e.at.slice(0,10);return S.set.dateBasis==='actual'?d:(workday(e.at)??d)};
function todayKey(){const n=nowParts();if(S.set.dateBasis==='actual')return n.date;return workday(n.date+'T'+n.time)??n.date}
const monthRange=(y,m)=>({from:y+'-'+pad(m)+'-01',to:ymd(new Date(y,m,0))});
function rangeOf(p){
 const t=todayKey(),[y,m]=ymdParts(t);let r;
 switch(p.kind){
  case 'today':r={from:t,to:t};break;
  case 'yesterday':{const d=addDays(t,-1);r={from:d,to:d};break}
  case 'thisMonth':r=monthRange(y,m);break;
  case 'lastMonth':r=monthRange(m===1?y-1:y,m===1?12:m-1);break;
  case 'thisYear':r={from:y+'-01-01',to:y+'-12-31'};break;
  case 'day':r={from:p.day||t,to:p.day||t};break;
  case 'month':{const [yy,mm]=(p.month||t.slice(0,7)).split('-').map(Number);r=monthRange(yy,mm);break}
  case 'year':{const yy=+(p.year||y);r={from:yy+'-01-01',to:yy+'-12-31'};break}
  case 'custom':r={from:p.from||'',to:p.to||''};if(r.from&&r.to&&r.from>r.to)r={from:r.to,to:r.from};break;
  default:r={from:'',to:''}}
 return r;}
const inR=(d,r)=>!!d&&(!r.from||d>=r.from)&&(!r.to||d<=r.to);
const rangeLabel=r=>(!r.from&&!r.to)?'كل الفترات':(r.from===r.to?fmtDay(r.from,true):'من '+(r.from?fmtShort(r.from):'البداية')+' إلى '+(r.to?fmtShort(r.to):'اليوم'));
const basisLabel=()=>S.set.dateBasis==='actual'?'التاريخ الفعلي للأوردر':'يوم العمل ('+fmtTime(S.set.workStart)+' حتى '+fmtTime(S.set.workEnd)+' من اليوم التالي)';
function query(f){
 const out={orders:[],cancelled:[],outside:[]};
 for(const o of S.data.orders){
  if(f.typeId&&o.typeId!==f.typeId&&!(Array.isArray(o.venueItems)&&o.venueItems.some(v=>v.typeId===f.typeId)))continue;
  if(f.venueId&&!venueMatches(o,f.venueId))continue;
  if(f.accountId&&!(S.ix.sp.get(o.id)||[]).some(s=>s.accountId===f.accountId))continue;
  const day=effDay(o),allDates=!f.range||(!f.range.from&&!f.range.to);
  if(!allDates&&day===null){if(inR(o.orderAt.slice(0,10),f.range))out.outside.push(o);continue}
  if(!allDates&&!inR(day,f.range))continue;
  (o.status==='cancelled'?out.cancelled:out.orders).push(o);}

function summarize(f){
 const q=query(f),act=q.orders;
 const byAcc=new Map(),byVenue=new Map(),byType=new Map(),byDay=new Map(),durs=[];
 let dist=0,app=0,courier=0,recog=0,completed=0;
 const vget=o=>{const k=vkey(o);if(!byVenue.has(k))byVenue.set(k,{key:k,name:vname(o),typeId:o.typeId,count:0,total:0,app:0,cancelled:0,last:'',durs:[]});return byVenue.get(k)};
 for(const o of act){
  if(o.status==='completed')completed++;
  const v=vget(o);v.count++;if(o.orderAt>v.last)v.last=o.orderAt;
  const t=byType.get(o.typeId)||{id:o.typeId,count:0,total:0};t.count++;byType.set(o.typeId,t);
  const day=effDay(o);const dd=byDay.get(day)||{day,count:0,total:0};dd.count++;byDay.set(day,dd);
  for(const s of splitsOf(o,f.accountId)){
   const c=Math.round(s.amount*100),ty=accType(s.accountId);
   dist+=c;v.total+=c;t.total+=c;dd.total+=c;
   if(ty==='app'){app+=c;v.app+=c}if(ty==='courier')courier+=c;if(S.set.revenueTypes.includes(ty))recog+=c;
   const ba=byAcc.get(s.accountId)||{id:s.accountId,orders:new Set(),total:0};ba.total+=c;ba.orders.add(o.id);byAcc.set(s.accountId,ba);}
  const d=dur(o);if(d!=null&&d>=0){durs.push({o,d});v.durs.push(d)}}
 for(const o of q.cancelled)vget(o).cancelled++;
 const R={q,count:act.length,completed,cancelled:q.cancelled.length,total:act.length+q.cancelled.length,dist:dist/100,app:app/100,courier:courier/100,recog:recog/100};
 R.avg=R.count?r2(R.dist/R.count):0;
 R.byAcc=[...byAcc.values()].map(a=>({id:a.id,count:a.orders.size,total:a.total/100})).sort((a,b)=>b.total-a.total);
 R.byVenue=[...byVenue.values()].map(v=>({...v,total:v.total/100,app:v.app/100,avg:v.count?r2(v.total/100/v.count):0,avgDur:v.durs.length?Math.round(v.durs.reduce((a,b)=>a+b,0)/v.durs.length):null}));
 R.byType=[...byType.values()].map(t=>({...t,total:t.total/100}));
 R.byDay=[...byDay.values()].map(d=>({...d,total:d.total/100})).sort((a,b)=>a.day<b.day?-1:1);
 R.deliv={n:durs.length,avg:durs.length?Math.round(durs.reduce((a,b)=>a+b.d,0)/durs.length):null,min:durs.length?durs.reduce((a,b)=>b.d<a.d?b:a):null,max:durs.length?durs.reduce((a,b)=>b.d>a.d?b:a):null};
 R.topCount=R.byVenue.slice().sort((a,b)=>b.count-a.count)[0]||null;
 R.topIncome=R.byVenue.slice().sort((a,b)=>b.total-a.total)[0]||null;
 if(!f.typeId&&!f.venueId&&!f.accountId){R.expenses=sum(S.data.expenses.filter(e=>inR(expDay(e),f.range)).map(e=>e.amount));R.net=r2(R.recog-R.expenses)}else{R.expenses=null;R.net=null}

function cmpRef(total,ref){

 return d===0?{t:'green',l:'متطابق',diff:0}:d>0?{t:'amber',l:'يوجد فرق زيادة '+money(d),diff:d}:{t:'amber',l:'يوجد فرق نقص '+money(-d),diff:d};}

function dialog({title,text='',confirmText='تأكيد',cancelText='إلغاء',danger=false,requireText=null,input=null,extra=''}){
 return new Promise(res=>{
  const root=$('#dialogRoot');
  root.innerHTML=`<div class="overlay"><div class="dlg" role="alertdialog" aria-modal="true"><h3>${esc(title)}</h3>${text?`<p>${esc(text)}</p>`:''}${extra}${requireText?`<input id="dlgIn" autocomplete="off" placeholder="${esc(requireText)}">`:''}${input?`<label class="lb" for="dlgIn">${esc(input.label)}</label><input id="dlgIn" autocomplete="off" value="${esc(input.value||'')}" placeholder="${esc(input.placeholder||'')}">`:''}<div class="acts"><button class="btn ${danger?'solid-danger':'primary'}" id="dlgOk" ${requireText?'disabled':''}>${esc(confirmText)}</button><button class="btn" id="dlgNo">${esc(cancelText)}</button></div></div></div>`;
  const done=v=>{root.innerHTML='';document.removeEventListener('keydown',kd,true);res(v)};
  const inp=$('#dlgIn'),ok=$('#dlgOk');
  const accept=()=>{if(ok.disabled)return;if(input){const v=inp.value.trim();if(!v){inp.focus();return}done(v)}else done(true)};
  const kd=e=>{if(e.key==='Escape'){e.stopPropagation();done(input?null:false)}else if(e.key==='Enter'&&(input||requireText)){e.preventDefault();accept()}};
  document.addEventListener('keydown',kd,true);
  if(requireText)inp.addEventListener('input',()=>{ok.disabled=inp.value.trim()!==requireText});
  ok.onclick=accept;$('#dlgNo').onclick=()=>done(input?null:false);
  (inp||ok).focus();});}

function chartsHtml(sm){

function validateForm(){
 const F=S.form,errors=[];
 if(!F.typeId)errors.push('اختر نوع الطلب.');
 if(!F.freeVenue&&!F.venueId)errors.push('اختر الجهة التي خرج منها الطلب أو أضف جهة جديدة.');
 if(F.freeVenue&&!F.venueText.trim())errors.push('اكتب اسم الجهة.');
  const venueKeys=[F.freeVenue?'txt:'+F.venueText.trim():F.venueId,...F.venueItems.map(v=>v.venueId)].filter(Boolean);if(new Set(venueKeys).size!==venueKeys.length)errors.push('لا يمكن اختيار المكان نفسه أكثر من مرة في الأوردر.');
  F.venueItems.forEach((v,i)=>{if(!v.typeId)errors.push('اختر نوع المكان الإضافي '+(i+2)+'.');if(!v.venueId)errors.push('اختر المكان الإضافي '+(i+2)+'.');if(v.amount!==''&&(!Number.isFinite(Number(v.amount))||Number(v.amount)<0))errors.push('تكلفة المكان الإضافي '+(i+2)+' غير صالحة.');});
  if(F.primaryVenueAmount!==''&&(!Number.isFinite(Number(F.primaryVenueAmount))||Number(F.primaryVenueAmount)<0))errors.push('تكلفة المكان الأول غير صالحة.');
 if(!F.date)errors.push('حدد تاريخ الأوردر.');if(!F.time)errors.push('حدد وقت طلب الأوردر.');
 const at=F.date+'T'+F.time;if(F.date&&F.time&&!parseLocal(at))errors.push('تاريخ أو وقت الأوردر غير صالح.');
 const di=delivISO();
 if(F.delivDate&&!F.delivTime)errors.push('أدخل وقت التوصيل الفعلي أو امسح تاريخ التوصيل.');
 if(di){const d=dur({orderAt:at,deliveredAt:di});if(d==null)errors.push('وقت التوصيل غير صالح.');else if(d<0)errors.push('وقت التوصيل الفعلي قبل وقت الطلب. إذا كان التوصيل بعد منتصف الليل فاجعل التاريخ اليوم التالي.');else if(d>1440)errors.push('مدة التوصيل أكثر من 24 ساعة. راجع تاريخ التوصيل.');}
 const splits=[];
 F.splits.forEach((r,i)=>{
  const empty=!r.accountId&&r.amount===''&&!r.note.trim();if(empty)return;
  const n='صف التوزيع '+(i+1)+': ';
  if(!r.accountId){errors.push(n+'اختر الحساب المستفيد.');return}
  if(r.amount===''||isNaN(parseFloat(r.amount))){errors.push(n+'أدخل المبلغ (يقبل الصفر).');return}
  const a=parseFloat(r.amount);if(a<0){errors.push(n+'لا يُسمح بمبلغ سالب.');return}
  splits.push({key:r.key,id:r.id,accountId:r.accountId,amount:r2(a),note:r.note.trim(),originalAmount:r.originalAmount});});
 if(F.refValue!==''&&(isNaN(parseFloat(F.refValue))||parseFloat(F.refValue)<0))errors.push('القيمة المرجعية غير صالحة.');
 if(S.set.blockOnMismatch&&F.refValue!==''&&!errors.length){const c=cmpRef(sum(splits.map(s=>s.amount)),F.refValue);if(c&&c.diff!==0)errors.push('إجمالي التوزيعة لا يطابق القيمة المرجعية ('+c.l+'). هذا الشرط مفعّل من الإعدادات.')}
 const tips=[];if(F.tipsOn)F.tips.forEach((x,i)=>{const n='التبس '+(i+1)+': ';const a=parseFloat(x.amount);if(x.amount===''||!Number.isFinite(a)||a<=0){errors.push(n+'أدخل مبلغًا أكبر من صفر.');return}if(!TIP_KINDS[x.kind]){errors.push(n+'اختر الجهة المستحقة.');return}if(TIP_ACC[x.kind]&&!x.accountId){errors.push(n+'اختر '+TIP_KINDS[x.kind]+' المستحق.');return}if(x.kind==='other'&&!(x.name||'').trim()){errors.push(n+'اكتب اسم الجهة.');return}tips.push({id:x.id||uid(),kind:x.kind,accountId:TIP_ACC[x.kind]?x.accountId:'',name:x.kind==='other'?x.name.trim():'',amount:r2(a)})});
 if(F.freeDelivery&&splits.some(s=>s.amount>0&&accType(s.accountId)==='app'))errors.push('التوصيل مجاني: لا يُحتسب مبلغ للتطبيق في التوزيعة. اجعله صفرًا أو ألغِ التوصيل المجاني.');
 const conf=F.confTime&&F.date&&F.time?(F.confTime<F.time?addDays(F.date,1):F.date)+'T'+F.confTime:null;if(F.confTime&&!conf)errors.push('وقت التأكيد غير صالح.');
 let rp=null;if(F.rpAmount!==''){const a=parseFloat(F.rpAmount);if(!Number.isFinite(a)||a<0)errors.push('مبلغ ربح المطعم غير صالح.');else if(a>0){const vid=F.rpVenueId||(F.freeVenue?'':F.venueId);const vv=vid&&S.ix.venue.get(vid);if(!vv)errors.push('اختر المطعم الخاص بربح المطعم.');else rp={venueId:vid,venueName:vv.name,amount:r2(a)}}}
 return {errors,splits,at,di,tips,conf,rp};}

 h+=`<div class="grid g4">${stat('إجمالي الأوردرات',sm.total,'المحتسبة + الملغاة')}${stat('المحتسبة (غير الملغاة)',sm.count)}${stat('المكتملة',sm.completed,'','green')}${stat('الملغاة',sm.cancelled,'','amber')}

function validateBackup(raw){
 const errs=[];const add=m=>{if(errs.length<12)errs.push(m)};
 if(!raw||typeof raw!=='object'||Array.isArray(raw))return {errors:['الملف ليس نسخة احتياطية صالحة.']};
 if(raw.app!==APP_ID)return {errors:['هذا الملف ليس نسخة احتياطية من هذا التطبيق.']};
 if(!Number.isInteger(raw.schemaVersion)||raw.schemaVersion<1)return {errors:['إصدار بنية الملف غير معروف.']};
 if(raw.schemaVersion>SCHEMA_VERSION)return {errors:['الملف أحدث من إصدار التطبيق الحالي. حدّث التطبيق أولًا.']};
 for(let v=raw.schemaVersion+1;v<=SCHEMA_VERSION;v++)if(BACKUP_MIGRATIONS[v])raw=BACKUP_MIGRATIONS[v](raw);
 const d=raw.data;if(!d||typeof d!=='object')return {errors:['بيانات النسخة مفقودة.']};
 const names=['orders','splits','venues','accounts','expenses','types','cats'];
 for(const n of names)if(!Array.isArray(d[n]))add('القسم «'+n+'» مفقود أو غير صالح.');
 if(errs.length)return {errors:errs};
 const ids={};
 for(const n of names){ids[n]=new Set();for(const x of d[n]){if(!x||typeof x.id!=='string'||!x.id){add('سجل بدون معرف في «'+n+'».');continue}if(ids[n].has(x.id))add('معرف مكرر في «'+n+'».');ids[n].add(x.id)}}
 const refOk=(n,id)=>ids[n].has(id)||S.data[n].some(x=>x.id===id);
 const nos=new Set();
 for(const o of d.orders){
  if(!Number.isInteger(o.no)||o.no<1)add('أوردر برقم غير صالح.');else if(nos.has(o.no))add('رقم أوردر مكرر داخل الملف: '+o.no);nos.add(o.no);
  if(typeof o.orderAt!=='string'||!AT_RE.test(o.orderAt))add('أوردر #'+o.no+': تاريخ غير صالح.');
  if(o.deliveredAt!=null&&!AT_RE.test(o.deliveredAt))add('أوردر #'+o.no+': وقت توصيل غير صالح.');
  if(!STATUS[o.status])add('أوردر #'+o.no+': حالة غير صالحة.');
  if(!refOk('types',o.typeId))add('أوردر #'+o.no+': نوع طلب غير موجود.');
  if(o.venueId&&!refOk('venues',o.venueId))add('أوردر #'+o.no+': جهة غير موجودة.');
   if(Array.isArray(o.venueItems))for(const v of o.venueItems){if(v.venueId&&!refOk('venues',v.venueId))add('أوردر #'+o.no+': جهة إضافية غير موجودة.');if(v.typeId&&!refOk('types',v.typeId))add('أوردر #'+o.no+': نوع جهة إضافية غير موجود.');}}
 for(const s of d.splits){
  if(!ids.orders.has(s.orderId))add('توزيع مرتبط بأوردر غير موجود.');
  if(!refOk('accounts',s.accountId))add('توزيع مرتبط بحساب غير موجود.');
  if(typeof s.amount!=='number'||!isFinite(s.amount)||s.amount<0)add('توزيع بمبلغ غير صالح.');}
 for(const e of d.expenses){if(typeof e.at!=='string'||!AT_RE.test(e.at))add('مصروف بتاريخ غير صالح.');if(typeof e.amount!=='number'||!isFinite(e.amount)||e.amount<0)add('مصروف بمبلغ غير صالح.');if(!refOk('cats',e.catId))add('مصروف بتصنيف غير موجود.')}
 for(const n of ['venues','accounts','types','cats'])for(const x of d[n])if(typeof x.name!=='string'||!x.name.trim())add('سجل بلا اسم في «'+n+'».');
 if(errs.length)return {errors:errs};
 return {errors:[],data:d,exportedAt:raw.exportedAt,summary:{orders:d.orders.length,venues:d.venues.length,accounts:d.accounts.length,expenses:d.expenses.length,splits:d.splits.length}};}
async function applyImport(mode){
 const imp=S.imp;if(!imp||!imp.data)return;const d=imp.data;
 const idsOf=n=>new Set(d[n].map(x=>x.id));
 try{
  if(mode==='replace'){
   const ids={venues:idsOf('venues'),accounts:idsOf('accounts'),types:idsOf('types'),cats:idsOf('cats')};
   const bad=d.orders.some(o=>!ids.types.has(o.typeId)||(o.venueId&&!ids.venues.has(o.venueId))||(Array.isArray(o.venueItems)&&o.venueItems.some(v=>(v.venueId&&!ids.venues.has(v.venueId))||(v.typeId&&!ids.types.has(v.typeId)))))||d.splits.some(s=>!ids.accounts.has(s.accountId))||d.expenses.some(e=>!ids.cats.has(e.catId));
   if(bad)throw new Error('الملف يشير إلى سجلات غير موجودة بداخله، ولا يصلح للاستبدال الكامل. جرّب الدمج.');
   /* الاستبدال يُنفَّذ في Firestore أولًا؛ إن فشل لا تتغير البيانات المحلية */
   const newSet=Object.assign({},DEFAULT_SETTINGS,d.settings||{},{key:'main'}),mm=d.meta||{};
   await CL.replaceAll({orders:d.orders,splits:d.splits,venues:d.venues,accounts:d.accounts,expenses:d.expenses,types:d.types,cats:d.cats,customers:d.customers||[],agreements:d.agreements||[],collections:d.collections||[],settings:newSet,orderSeq:Math.max(1000,mm.orderSeq||0,...d.orders.map(o=>o.no)),expenseSeq:Math.max(0,mm.expenseSeq||0,...d.expenses.map(e=>e.no||0))});
   await new Promise((res,rej)=>{
    const t=DB.db.transaction(STORES,'readwrite');
    t.oncomplete=res;t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('تم إلغاء العملية'));
    STORES.forEach(s=>t.objectStore(s).clear());
    ['orders','splits','venues','accounts','expenses','types','cats','customers','agreements','collections'].forEach(n=>(d[n]||[]).forEach(x=>t.objectStore(n).put(x)));
    t.objectStore('settings').put(Object.assign({},DEFAULT_SETTINGS,d.settings||{},{key:'main'}));
    const m=d.meta||{};
    t.objectStore('meta').put({key:'orderSeq',value:Math.max(1000,m.orderSeq||0,...d.orders.map(o=>o.no))});
    t.objectStore('meta').put({key:'expenseSeq',value:Math.max(0,m.expenseSeq||0,...d.expenses.map(e=>e.no||0))});});
   await refresh();S.imp=null;toast('تم استبدال البيانات بنجاح');
  }else{
   const cur={};['orders','splits','venues','accounts','expenses','types','cats','customers','agreements','collections'].forEach(n=>cur[n]=new Set(S.data[n].map(x=>x.id)));
   const usedNos=new Set(S.data.orders.map(o=>o.no)),usedEx=new Set(S.data.expenses.map(e=>e.no));
   const mo=await DB.get('meta','orderSeq'),me=await DB.get('meta','expenseSeq'),cc=await CL.readCounters();
   let oseq=Math.max(1000,mo?mo.value:0,cc.orderSeq,...usedNos),eseq=Math.max(0,me?me.value:0,cc.expenseSeq,...usedEx);
   let added={orders:0,venues:0,accounts:0,expenses:0,skipped:0,renumbered:0};const puts=[];
   for(const n of ['types','cats','venues','accounts','customers','agreements','collections'])for(const x of (d[n]||[])){if(cur[n].has(x.id))continue;puts.push([n,x]);if(n==='venues'||n==='accounts')added[n]++}
   const newOrders=new Set();
   for(const o of d.orders){if(cur.orders.has(o.id)){added.skipped++;continue}
    const n={...o};if(usedNos.has(n.no)){n.no=++oseq;added.renumbered++}usedNos.add(n.no);newOrders.add(o.id);puts.push(['orders',n]);added.orders++}
   for(const s of d.splits)if(newOrders.has(s.orderId)&&!cur.splits.has(s.id))puts.push(['splits',s]);
   for(const e of d.expenses){if(cur.expenses.has(e.id)){added.skipped++;continue}const n={...e};if(!n.no||usedEx.has(n.no))n.no=++eseq;usedEx.add(n.no);puts.push(['expenses',n]);added.expenses++}
   puts.push(['meta',{key:'orderSeq',value:Math.max(oseq,...usedNos)}]);puts.push(['meta',{key:'expenseSeq',value:Math.max(eseq,...usedEx)}]);
   await DB.putMany(puts);await refresh();S.imp=null;
   toast(`تم الدمج: ${added.orders} أوردر جديد، ${added.expenses} مصروف، ${added.venues} جهة، ${added.accounts} حساب${added.renumbered?` (أُعيد ترقيم ${added.renumbered} أوردر لتعارض الأرقام)`:''}${added.skipped?`، وتخطي ${added.skipped} سجل موجود`:''}`);}
 }catch(e){console.error(e);toast('فشل الاستيراد ولم تتغير بياناتك: '+(e.message||e),'err')}
 viewSettings();}

 repKind(t){S.f.rep.kind=t.dataset.k;$('#repFilters').innerHTML=repFiltersHtml()},
 repApply(){const p=S.f.rep;if(p.kind==='custom'&&p.from&&p.to&&p.from>p.to)return toast('تاريخ البداية بعد تاريخ النهاية','err');S.f.repApplied={...p};S.f.repPage=1;drawReport();toast('تم تطبيق الفلتر')},
 repReset(){const t=todayKey();S.f.rep={kind:'month',day:t,month:t.slice(0,7),year:t.slice(0,4),from:'',to:'',typeId:'',venueId:'',accountId:''};S.f.repApplied={...S.f.rep};S.f.repPage=1;S.f.repTab='active';viewReports()},
 repTab(t){S.f.repTab=t.dataset.k;S.f.repPage=1;drawReport()},repMore(){S.f.repPage++;drawReport()},
 repPrint(){reportPrint()},
 repCsv(){const sm=repSummary();const list=sm.q.orders.concat(sm.q.cancelled);if(!list.length)return toast('لا توجد أوردرات في التقرير لتصديرها','warn');download('wasalha-report-'+stamp()+'.csv','text/csv;charset=utf-8',ordersCsv(list,false));toast('تم تصدير التقرير (بدون بيانات العملاء)')},
 exportJson(){exportJson()},
 exportCsvAll(){if(!S.data.orders.length)return toast('لا توجد أوردرات','warn');download('wasalha-orders-'+stamp()+'.csv','text/csv;charset=utf-8',ordersCsv(S.data.orders,$('#csvCust').checked));toast('تم تصدير الأوردرات')},
 setTab(t){S.setTab=t.dataset.k;viewSettings()},
 impCancel(){S.imp=null;viewSettings()},
 impMerge(){applyImport('merge')},
 async impReplace(){
  const ok=await confirmDialog({title:'استبدال كل البيانات؟',text:'سيتم مسح أوردراتك وجهاتك وحساباتك ومصروفاتك الحالية واستبدالها بمحتوى الملف، وسيُنزَّل تلقائيًا نسخة من بياناتك الحالية قبل ذلك كإجراء أمان. لا يمكن التراجع عن الاستبدال.',confirmText:'استبدال',danger:true,requireText:'استبدال'});
  if(!ok)return;if(S.data.orders.length||S.data.expenses.length){await exportJson()}applyImport('replace')},
 async wipe(){if(await confirmDialog({title:'مسح جميع البيانات؟',text:'سيتم حذف كل شيء من السحابة (لكل الأجهزة) ومن هذا المتصفح نهائيًا. إن لم تكن أخذت نسخة احتياطية فخذها الآن قبل المتابعة.',confirmText:'مسح نهائي',danger:true,requireText:'مسح كل البيانات'})){try{await wipeAll()}catch(e){toast('تعذر مسح البيانات السحابية ولم تتغير بياناتك المحلية: '+(e&&e.message||e),'err')}}},
 typeEdit(t){const x=S.ix.type.get(t.dataset.id);openModal('تعديل نوع الطلب',`<div class="fg"><div class="f"><label class="lb">اسم النوع</label><input id="tfName" value="${esc(x.name)}"></div><div class="f"><label class="lb">اسم قسم الجهات</label><input id="tfLabel" value="${esc(x.venueLabel||x.name)}"></div><div class="f wide"><label class="checks"><input type="checkbox" id="tfFree" ${x.allowFreeVenue?'checked':''}> السماح بكتابة جهة حرة غير مسجلة</label></div></div><div class="mf"><button class="btn primary" data-act="typeSave" data-id="${x.id}">${ic('check')} حفظ</button><button class="btn" data-act="closeModal">إلغاء</button></div>`)},
 async typeSave(t){const x=S.ix.type.get(t.dataset.id),name=$('#tfName').value.trim();if(!name)return toast('اكتب الاسم','err');await DB.put('types',{...x,name,venueLabel:$('#tfLabel').value.trim()||name,allowFreeVenue:$('#tfFree').checked});await refresh();closeModal();toast('تم الحفظ');viewSettings()},
 async typeToggle(t){const x=S.ix.type.get(t.dataset.id);if(x.active&&S.data.types.filter(a=>a.active).length<2)return toast('يجب أن يبقى نوع طلب واحد على الأقل مفعّلًا','err');await DB.put('types',{...x,active:!x.active});await refresh();viewSettings()},
 async catAdd(){const n=await askText('إضافة تصنيف مصروفات','اسم التصنيف');if(!n)return;await DB.put('cats',{id:uid(),name:n,active:true,sort:Math.max(0,...S.data.cats.map(x=>x.sort||0))+1});await refresh();viewSettings()},
 async catEdit(t){const c=S.ix.cat.get(t.dataset.id);const n=await askText('تعديل التصنيف','الاسم',c.name);if(!n)return;await DB.put('cats',{...c,name:n});await refresh();viewSettings()},
 async catToggle(t){const c=S.ix.cat.get(t.dataset.id);await DB.put('cats',{...c,active:!c.active});await refresh();viewSettings()}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;if(Actions[a]){if(t.tagName==='A'&&a!=='goVenueOrders'&&a!=='goBackup')e.preventDefault();Promise.resolve(Actions[a](t,e)).catch(err=>{console.error(err);toast('حدث خطأ: '+(err&&err.message||err),'err')})}});
document.addEventListener('keydown',e=>{
 if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role=button][data-act]')){e.preventDefault();e.target.click()}
 if(e.key==='Escape'&&$('#modalRoot').firstChild&&!$('#dialogRoot').firstChild)closeModal();
 formKey(e);
 if(e.altKey&&(e.key==='n'||e.key==='ن'||e.code==='KeyN')){e.preventDefault();location.hash='#/order'}
 if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test((e.target.tagName||''))){const s=$('#oq')||$('#vq');if(s){e.preventDefault();s.focus()}}});
let tmr;
function onField(e){
 const t=e.target;
 if(t.dataset&&t.dataset.cs){if(S.form&&!t.value.trim()&&S.form.customerId){S.form.customerId='';S.form.dirty=true}showCust(t.value);return}
 if(t.dataset&&t.dataset.tp&&S.form&&t.closest('#view')){const r=S.form.tips.find(x=>x.key===t.closest('[data-tip]').dataset.tip);if(r){r[t.dataset.tp]=t.value;S.form.dirty=true;if(t.dataset.tp==='kind'&&e.type==='change'){r.accountId='';r.name='';$('#tipRows').innerHTML=tipRowsHtml()}updateTotals()}return}
 if(t.dataset&&t.dataset.vi&&S.form&&t.closest('#view')){const v=S.form.venueItems.find(x=>x.key===t.dataset.key);if(v){v[t.dataset.vi]=t.value;S.form.dirty=true;if(t.dataset.vi==='typeId'){v.venueId='';$('#venueExtras').innerHTML=extraVenuesHtml()}}return}
 if(t.dataset&&t.dataset.fm&&S.form&&t.closest('#view')){formInput(t);return}
 if(t.dataset&&t.dataset.rp){S.f.rep[t.dataset.rp]=t.value;return}
 if(t.dataset&&t.dataset.vf){vState[t.dataset.vf]=t.type==='checkbox'?t.checked:t.value;drawVenuesRes();return}
 if(t.dataset&&t.dataset.af){aState[t.dataset.af]=t.type==='checkbox'?t.checked:t.value;drawAccountsRes();return}
 if(t.dataset&&t.dataset.f){
  const [ns,k]=t.dataset.f.split('.');
  if(ns==='repVenueSort'){S.f.repVenueSort=t.value;drawReport();return}
  const tgt=ns==='m'?S.m:S.f[ns];if(!tgt)return;
  if(k===undefined)return;tgt[k]=t.value;if(t.type==='number'&&e.type==='input')return;
  const run=()=>{if(ns==='cu')(k==='q'||k==='n1'||k==='n2')?drawCuRes():viewCustomers();else if(ns==='ag')drawAgRes();else if(ns==='rp')viewRP();else if(ns==='dash')viewDashboard();else if(ns==='orders'){S.f.orders.page=1;drawOrdersRes()}else if(ns==='exp'){k==='q'?drawExpRes():viewExpenses()}else if(ns==='m')drawModal()};
  if(t.type==='search'||t.type==='text'||t.type==='number'){clearTimeout(tmr);tmr=setTimeout(run,180)}else run();return}
 if(t.dataset&&t.dataset.set&&e.type==='change')return saveSetting(t);
 if(t.dataset&&t.dataset.rt&&e.type==='change'){if(!settingsReady()){toast('لم تكتمل مزامنة الإعدادات مع السحابة بعد، لذلك لم يُحفظ التغيير.','err');viewSettings();return}
  const oldRt=S.set.revenueTypes;S.set.revenueTypes=$$('[data-rt]').filter(x=>x.checked).map(x=>x.dataset.rt);
  saveSettings().then(()=>toast('تم حفظ الإعداد')).catch(err=>{S.set.revenueTypes=oldRt;toast('تعذر حفظ الإعداد: '+(err&&err.message||err),'err');viewSettings()})}}
async function saveSetting(t){
 const k=t.dataset.set;let v=t.type==='checkbox'?t.checked:t.type==='number'?Math.max(0,parseInt(t.value)||0):t.value;
 if((k==='workStart'||k==='workEnd')&&!/^\d{2}:\d{2}$/.test(v))return toast('أدخل وقتًا صالحًا','err');
 if(k==='appName'&&!String(v).trim())v=DEFAULT_SETTINGS.appName;
 if(!settingsReady()){toast('لم تكتمل مزامنة الإعدادات مع السحابة بعد، لذلك لم يُحفظ التغيير. حاول بعد قليل.','err');if(S.route==='settings')viewSettings();return}
 const oldV=S.set[k];S.set[k]=v;
 try{await saveSettings()}catch(err){S.set[k]=oldV;toast('تعذر حفظ الإعداد: '+(err&&err.message||err),'err');if(S.route==='settings')viewSettings();else if(t.dataset.after==='rep'){$('#repFilters').innerHTML=repFiltersHtml()}return}
 setBrand();toast('تم حفظ الإعداد');
 if(t.dataset.after==='rep'){$('#repFilters').innerHTML=repFiltersHtml();drawReport()}
 else if(k==='dateBasis'||k==='outsidePolicy'||k==='workStart'||k==='workEnd'){/* يتجدد في الصفحات عند فتحها */}
 if(S.route==='settings'&&(k==='dateBasis'))viewSettings();}
document.addEventListener('input',onField);document.addEventListener('change',onField);
document.addEventListener('change',async e=>{
 if(e.target.id==='impFile'){const f=e.target.files[0];if(!f)return;
  if(f.size>60*1024*1024){S.imp={errors:['الملف كبير جدًا.']};viewSettings();return}
  try{const text=await f.text();let raw;try{raw=JSON.parse(text)}catch{S.imp={errors:['الملف ليس JSON صالحًا.'],name:f.name};viewSettings();return}
   const v=validateBackup(raw);S.imp=Object.assign(v,{name:f.name});}catch(err){S.imp={errors:['تعذر قراءة الملف: '+err.message]}}
  viewSettings();}});

/* =====================================================================
   18) التشغيل
   ===================================================================== */
async function boot(){
 buildNav();
 try{
  await DB.open();await loadAll(); // النسخة المحلية للعرض السريع فقط؛ التهيئة الأولية تتم في السحابة (CL.start) بعد تحقق مؤكد من الخادم
  if(navigator.storage&&navigator.storage.persist){try{await navigator.storage.persist();S.persisted=await navigator.storage.persisted()}catch{}}
 }catch(e){
  console.error(e);
  $('#view').innerHTML=`<div class="card"><div class="note bad"><b>تعذر تشغيل التخزين المحلي.</b><br>${esc(e.message||e)}<br>جرّب فتح التطبيق من متصفح حديث (Chrome / Edge / Firefox) خارج وضع التصفح الخفي، أو شغّله من خادم محلي بدل فتح الملف مباشرة.</div></div>`;return}
 setBrand();const t=todayKey();Object.assign(S.f.rep,{day:t,month:t.slice(0,7),year:t.slice(0,4)});
 curHash=location.hash;navigate();
 window.WBM={S,workday,rangeOf,summarize,effDay,query,dur,validateBackup,CL};
 CL.start();
}
boot();
})();
</script>
